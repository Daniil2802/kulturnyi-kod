<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Места — Культурный код Кузбасса</title>
  <link rel="stylesheet" href="css/style.css?v=home-stops-spacing-20261124">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html" aria-label="Даром — на главную"><img src="assets/logo-lavka.png" alt="Даром"></a>
  <nav aria-label="Главная навигация">
   <a class="active" href="places.html">Места</a><a href="catalog.html">Предметы</a><a href="collection.html">Культурный чек</a><a href="partners.html">Партнёры</a><a href="contacts.html">Контакты</a><a href="about.html">О проекте</a>
  </nav>
 </header>
<main class="page">
  <p class="eyebrow">Культурный маршрут</p>
  <h1>Выбери город или район</h1>
  <p class="lead">Начни с города или района, а затем открой места, истории и предметы, связанные с ним.</p>
  <div id="areaList" class="region-grid"></div>
</main>
<script src="js/places-data.js?v=tazgol-cultural-items-20261123"></script>
<script src="js/areas.js"></script>
<script>
(() => {
  const page = location.pathname.split("/").pop() || "index.html";
  const sectionByPage = {
    "places.html": "places.html",
    "area.html": "places.html",
    "place.html": "places.html",
    "catalog.html": "catalog.html",
    "item.html": "catalog.html",
    "peoples.html": "catalog.html",
    "collection.html": "collection.html",
    "partners.html": "partners.html",
    "contacts.html": "contacts.html",
    "about.html": "about.html"
  };
  const target = sectionByPage[page];
  document.querySelectorAll(".header nav a").forEach(link => {
    const linkPage = new URL(link.href, location.href).pathname.split("/").pop();
    link.classList.toggle("active", Boolean(target && linkPage === target));
  });
})();
</script>
</body>
</html>
