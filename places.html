<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Места — Культурный код Кузбасса</title>
  <link rel="stylesheet" href="css/style.css?v=places-title-font-match-20261124">
</head>
<body class="places-catalog-page">
<header class="header">
  <a class="logo" href="index.html" aria-label="Даром — на главную"><img src="assets/logo-lavka.png" alt="Даром"></a>
  <nav aria-label="Главная навигация">
   <a class="active" href="places.html">Места</a><a href="catalog.html">Предметы</a><a href="collection.html">Культурный чек</a><a href="partners.html">Партнёры</a><a href="contacts.html">Контакты</a><a href="about.html">О проекте</a>
  </nav>
 </header>
<main class="page places-catalog-page">
  <div class="places-catalog-head">
    <p class="eyebrow">Культурный маршрут · Кузбасс</p>
    <h1>Места, которые хочется<br><span class="places-title-accent">открыть</span></h1>
    <p class="lead">Выбирай музей, природную точку или место с историей — и собирай свой культурный путь.</p>
  </div>
  <div class="places-catalog-controls" aria-label="Фильтры мест">
    <select id="placeAreaFilter" aria-label="Территория">
      <option value="">Все территории</option>
    </select>
    <select id="placeKindFilter" aria-label="Тип места">
      <option value="">Все типы мест</option>
    </select>
    <input id="placeSearch" type="search" placeholder="Найти место" aria-label="Поиск по местам">
    <select id="placeSort" aria-label="Порядок сортировки">
      <option value="recommended">Порядок: по умолчанию</option>
      <option value="title">Название: от А до Я</option>
    </select>
  </div>
  <div id="placeCatalog" class="places-catalog-grid" aria-live="polite"></div>
</main>
<script src="js/places-data.js?v=places-photo-catalog-20261124"></script>
<script src="js/place-selection.js?v=places-in-receipt-20261124"></script>
<script src="js/places-catalog.js?v=places-photo-catalog-20261124"></script>
<script>
(() => {
  const page = location.pathname.split("/").pop() || "index.html";
  const sectionByPage = {
    "places.html": "places.html",
    "area.html": "places.html",
    "place.html": "places.html",
    "catalog.html": "catalog.html",
    "item.html": "catalog.html",
    "peoples.html": "catalog.html",
    "collection.html": "collection.html",
    "partners.html": "partners.html",
    "contacts.html": "contacts.html",
    "about.html": "about.html"
  };
  const target = sectionByPage[page];
  document.querySelectorAll(".header nav a").forEach(link => {
    const linkPage = new URL(link.href, location.href).pathname.split("/").pop();
    link.classList.toggle("active", Boolean(target && linkPage === target));
  });
})();
</script>
</body>
</html>
