<script src="js/item.js?v=place-selection-20261124"></script>
<script>
(() => {
  const page = location.pathname.split("/").pop() || "index.html";
  const sectionByPage = {
    "places.html": "places.html",
    "area.html": "places.html",
    "place.html": "places.html",
    "catalog.html": "catalog.html",
    "item.html": "catalog.html",
    "peoples.html": "catalog.html",
    "collection.html": "collection.html",
    "partners.html": "partners.html",
    "contacts.html": "contacts.html",
    "about.html": "about.html"
  };
  const target = sectionByPage[page];
  document.querySelectorAll(".header nav a").forEach(link => {
    const linkPage = new URL(link.href, location.href).pathname.split("/").pop();
    link.classList.toggle("active", Boolean(target && linkPage === target));
  });
})();
</script>
<script src="js/mobile-nav.js?v=mobile-hamburger-20261124"></script>
